<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>리빙 구조 · 웹 프로토타입</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700;900&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{--bg:#FBF5F2;--ink:#3A1512;--mut:#7A5D57;--card:#fff;--line:rgba(58,21,18,.22);--grid:rgba(58,21,18,.055);--pat:rgba(58,21,18,.09);--rh:#F0D6CE;--rs:#F7E7E1;--rt:#E6C0B5;--rf:#A3281F;--fur:rgba(255,255,255,.78);--ac:#A3281F;--acs:rgba(163,40,31,.18);--sh:rgba(58,21,18,.16);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1C1210;--ink:#F4E8E3;--mut:#BFA39C;--card:#2A1B18;--line:rgba(244,232,227,.26);--grid:rgba(244,232,227,.05);--pat:rgba(244,232,227,.08);--rh:#4A2B27;--rs:#3E2521;--rt:#5C352F;--rf:#B8352A;--fur:rgba(255,255,255,.07);--ac:#E5604D;--acs:rgba(229,96,77,.3);--sh:rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1C1210;--ink:#F4E8E3;--mut:#BFA39C;--card:#2A1B18;--line:rgba(244,232,227,.26);--grid:rgba(244,232,227,.05);--pat:rgba(244,232,227,.08);--rh:#4A2B27;--rs:#3E2521;--rt:#5C352F;--rf:#B8352A;--fur:rgba(255,255,255,.07);--ac:#E5604D;--acs:rgba(229,96,77,.3);--sh:rgba(0,0,0,.35);color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;-webkit-text-size-adjust:100%}
body{overflow:hidden;padding-bottom:env(safe-area-inset-bottom,0px)}
button{font-family:inherit;color:inherit}
[hidden]{display:none!important}
.ser,h1,h2,h3{font-family:"Noto Serif KR","Nanum Myeongjo",serif}

/* ── 전체 틀: 한 화면 ── */
.app{height:100dvh;display:grid;grid-template-columns:minmax(0,1fr) 372px;grid-template-rows:auto minmax(0,1fr)}
.top{grid-column:1/-1;display:flex;align-items:flex-end;justify-content:space-between;gap:18px;padding:16px 24px 12px;border-bottom:1.5px solid var(--ink)}
.eyebrow{font:500 10.5px "Noto Sans KR",sans-serif;letter-spacing:.18em;color:var(--mut);margin:0 0 5px}
h1{font-weight:900;font-size:34px;line-height:1;letter-spacing:-.03em;margin:0}
.lead{font-family:"Noto Serif KR",serif;font-weight:700;font-size:14px;line-height:1.45;margin:7px 0 0}
.seg{display:flex;border:1.5px solid var(--ink);border-radius:999px;overflow:hidden;flex:none}
.seg button{padding:9px 16px;font:500 13px "Noto Sans KR",sans-serif;background:none;border:0;cursor:pointer;white-space:nowrap}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg);font-weight:700}
.seg .sm{display:none}
button:focus-visible,.fur:focus-visible{outline:3px solid var(--ac);outline-offset:2px}

/* ── 무대(평면도) ── */
.stage{min-height:0;min-width:0;display:flex;flex-direction:column;padding:14px 20px 10px;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px}
#plans{flex:1;min-height:0;display:flex;align-items:center;gap:20px}
.pw{flex:none;margin-inline:auto}
.pw .hd{height:42px;display:flex;flex-direction:column;justify-content:center;padding:0 2px 6px}
.pw h2{font-size:17px;margin:0;line-height:1.2}
.pw .tot{color:var(--mut);font-size:12px}
.pw svg{display:block;touch-action:manipulation;overflow:visible}
.key{display:flex;justify-content:center;flex-wrap:wrap;gap:2px 18px;font-size:12px;color:var(--mut);padding-top:8px}
.key b{color:var(--ink)}

/* ── 평면도 SVG ── */
svg text{font-family:"Noto Sans KR",sans-serif;pointer-events:none}
.rm text{fill:var(--ink)} .rm-f text{fill:#fff}
.rm-h .bg{fill:var(--rh)}.rm-s .bg{fill:var(--rs)}.rm-t .bg{fill:var(--rt)}.rm-f .bg{fill:var(--rf)}
.rm .bg{stroke:var(--ink);stroke-width:1.4}
.fur{stroke:var(--ink);fill:var(--fur);stroke-width:1.4;stroke-opacity:.9;stroke-linejoin:round;stroke-linecap:round;cursor:pointer;transition:stroke-width .15s;filter:drop-shadow(1.5px 2.5px 0 var(--sh))}
.fur path{fill:none}
.fur>.hit{fill:transparent!important;stroke:none!important}
.rm-f .fur{stroke:#fff;fill:rgba(255,255,255,.2);filter:drop-shadow(1.5px 2.5px 0 rgba(0,0,0,.25))}
.fur:hover{stroke-width:2.4}
.fur.sel{stroke:var(--ac);stroke-width:2.8;stroke-opacity:1}
.fur.sel>*{fill:var(--acs)}
.fur.sel>path{fill:none}
.rm-f .fur.sel{stroke:#fff;stroke-width:3.2}
.rm-f .fur.sel>*{fill:rgba(255,255,255,.55)}
.fur.sel+text{font-weight:900;fill:var(--ac)}
.rm-f .fur.sel+text{fill:#fff}
.wall{fill:none;stroke:var(--ink);stroke-width:5;stroke-linejoin:miter}
.ghost{fill:none;stroke:var(--line);stroke-dasharray:5 4}

/* ── 오른쪽 패널 ── */
.panel{min-height:0;display:flex;flex-direction:column;padding:18px 18px 14px;background:var(--card);border-left:1.5px solid var(--ink)}
.dc{flex:none}
.dh{display:flex;gap:12px;align-items:center}
.ic{width:68px;height:56px;border-radius:8px;display:grid;place-items:center;flex:none;border:1.2px solid var(--ink)}
.ic svg{width:60px;height:48px}
.ic .fur{cursor:default;filter:none;stroke-width:1.4}
.ic.rm-h{background:var(--rh)}.ic.rm-s{background:var(--rs)}.ic.rm-t{background:var(--rt)}.ic.rm-f{background:var(--rf)}
.ic.rm-f .fur{stroke:#fff;fill:rgba(255,255,255,.2)}
.dh .tx{flex:1;min-width:0}
.dh h3{font-size:22px;margin:0;line-height:1.15}
.dh .n{font-size:12.5px;color:var(--mut);margin:3px 0 0}
.dh .rt{text-align:right;font-family:"Noto Serif KR",serif;font-weight:900;font-size:26px;line-height:1;color:var(--ac)}
.dh .rt small{display:block;font:400 10.5px "Noto Sans KR",sans-serif;color:var(--mut);margin-top:4px}
.bars{margin:14px 0 0;display:grid;gap:7px}
.br{display:grid;grid-template-columns:58px 1fr 40px;gap:8px;align-items:center;font-size:12px}
.br span:first-child{color:var(--mut)}
.br .tr{height:10px;background:var(--line);border-radius:99px;overflow:hidden;display:block}
.br .tr i{display:block;height:100%;border-radius:99px;transition:width .25s}
.br .a{background:var(--ink)}.br .b{background:var(--ac)}.br .c{background:#D9902F}
.br b{text-align:right;font-family:"Noto Serif KR",serif;font-size:14px}
.mt{margin:14px 0 0;padding:2px 0 2px 11px;border-left:3px solid var(--ac);font-size:13.5px;line-height:1.6}
.mt em{display:block;font:700 10.5px "Noto Sans KR",sans-serif;letter-spacing:.14em;color:var(--ac);font-style:normal;margin-bottom:2px}
.tg{display:none}
.lst-wrap{flex:1;min-height:0;overflow:auto;margin-top:16px;padding-top:14px;border-top:1.5px solid var(--ink)}
.gt{display:flex;justify-content:space-between;font:700 12px "Noto Serif KR",serif;margin:0 0 6px}
.gt span{font:400 11px "Noto Sans KR",sans-serif;color:var(--mut)}
.grp{margin:0 0 12px}
.cg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.chip{display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:6px 9px;min-width:0;border:1.2px solid var(--line);border-radius:8px;background:none;font-size:12.5px;cursor:pointer;text-align:left}
.chip b{font:700 11.5px "Noto Serif KR",serif;white-space:nowrap}
.chip:hover{border-color:var(--ink)}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* 직접 입력 슬라이더 */
.sum{font-size:12.5px;color:var(--mut);margin:0 0 10px;line-height:1.5}
.pre{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 6px}
.pre button{font:500 12px "Noto Sans KR",sans-serif;padding:6px 12px;border:1.5px solid var(--ink);border-radius:999px;background:none;cursor:pointer}
.ctl-g{font:700 12.5px "Noto Serif KR",serif;margin:12px 0 0}
.ctl-r{display:grid;grid-template-columns:84px 1fr 36px;gap:8px;align-items:center;font-size:12.5px}
.ctl-r small{display:block;color:var(--mut);font-size:10.5px}
.ctl-r output{text-align:right;font:700 13px "Noto Serif KR",serif}
input[type=range]{width:100%;accent-color:var(--ac);margin:6px 0}

/* ── 모바일 ── */
@media (max-width:899px){
 .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto}
 .top{flex-direction:column;align-items:stretch;gap:10px;padding:10px 14px}
 h1{font-size:24px;display:inline}
 .eyebrow{display:none}
 .lead{font-size:12px;margin:4px 0 0}
 .seg{width:100%}.seg button{flex:1;padding:9px 2px;font-size:12.5px}
 .seg .lg{display:none}.seg .sm{display:inline}
 .stage{padding:8px 12px 6px}
 #plans{overflow-x:auto;scroll-snap-type:x mandatory;gap:14px}
 .pw{scroll-snap-align:center}
 .key{display:none}
 .panel{border-left:0;border-top:1.5px solid var(--ink);border-radius:16px 16px 0 0;padding:12px 14px 10px;box-shadow:0 -6px 20px var(--sh)}
 .ic{width:56px;height:46px}.ic svg{width:50px;height:40px}
 .dh h3{font-size:18px}.dh .rt{font-size:21px}
 .bars{margin-top:10px;gap:5px}
 .mt{margin-top:10px;font-size:12.5px;line-height:1.5}
 .mt em{display:none}
 .tg{display:block;width:100%;margin-top:10px;padding:8px;border:1.5px solid var(--ink);border-radius:999px;background:none;font:500 12.5px "Noto Sans KR",sans-serif;cursor:pointer}
 .lst-wrap{display:none;margin-top:10px;padding-top:10px}
 .panel.open .lst-wrap{display:block;max-height:30dvh}
 .panel.open .bars{display:none}
 .panel.open .mt{margin-top:8px}
}
@media (max-width:899px) and (min-width:700px){#plans{overflow:visible}}
@media (max-height:480px){body{overflow:auto}.app{height:auto;min-height:100dvh}.stage{min-height:420px}}
@media (prefers-reduced-motion:reduce){.fur,.br .tr i{transition:none}}
</style></head><body>
<div class="app">
 <header class="top">
  <div>
   <p class="eyebrow">FLOOR PLAN OF SPENDING</p>
   <h1>리빙 구조</h1>
   <p class="lead">식비가 많으면 주방이 커지고, 주거비가 많으면 침실이 커진다.</p>
  </div>
  <div class="seg" role="group" aria-label="보기">
   <button data-m="k" aria-pressed="false"><span class="lg">한국 1인 가구</span><span class="sm">한국</span></button>
   <button data-m="s" aria-pressed="false"><span class="lg">중국인 유학생</span><span class="sm">유학생</span></button>
   <button data-m="b" aria-pressed="true"><span class="lg">나란히 비교</span><span class="sm">비교</span></button>
   <button data-m="u" aria-pressed="false"><span class="lg">직접 입력</span><span class="sm">입력</span></button>
  </div>
 </header>
 <section class="stage" id="stage">
  <div id="plans"></div>
  <div class="key" id="key"><span><b>집</b> = 월 총지출</span><span><b>방</b> = 지출 비중</span><span><b>가구</b> = 세부 지출 (만원/월)</span><span>가구를 눌러 보세요</span></div>
 </section>
 <aside class="panel" id="panel">
  <section class="dc" id="det" aria-live="polite"></section>
  <button class="tg" id="tg" type="button"></button>
  <div class="lst-wrap">
   <div id="chips"></div>
   <section id="ctl" hidden></section>
  </div>
 </aside>
</div>
<script>
const $=id=>document.getElementById(id);
const f=n=>+n.toFixed(1);
const R=(x,y,w,h,r=0)=>`<rect x="${f(x)}" y="${f(y)}" width="${f(w)}" height="${f(h)}" rx="${f(r)}"/>`;
const C=(x,y,r)=>`<circle cx="${f(x)}" cy="${f(y)}" r="${f(r)}"/>`;
const P=d=>`<path d="${d}"/>`;
const L={
bed:(w,h)=>R(0,0,w,h,4)+R(w*.1,h*.07,w*.38,h*.18,3)+R(w*.52,h*.07,w*.38,h*.18,3)+P(`M0 ${f(h*.42)}H${f(w)}`),
heat:(w,h)=>R(0,0,w,h,3)+[.25,.5,.75].map(a=>P(`M${f(w*a)} ${f(h*.2)}V${f(h*.8)}`)).join(''),
wifi:(w,h)=>R(0,h*.45,w,h*.55,3)+P(`M${f(w*.25)} ${f(h*.45)}L${f(w*.15)} 0M${f(w*.75)} ${f(h*.45)}L${f(w*.85)} 0`),
fridge:(w,h)=>R(0,0,w,h,3)+P(`M0 ${f(h*.34)}H${f(w)}M${f(w*.8)} ${f(h*.1)}V${f(h*.26)}M${f(w*.8)} ${f(h*.44)}V${f(h*.68)}`),
table:(w,h)=>{const r=Math.min(w,h),c=r/2;return C(c,c,r*.3)+[[c,r*.1],[c,r*.9],[r*.1,c],[r*.9,c]].map(p=>C(p[0],p[1],r*.1)).join('')},
cafe:(w,h)=>P(`M${f(w*.12)} ${f(h*.22)}H${f(w*.7)}V${f(h*.68)}Q${f(w*.7)} ${f(h*.92)} ${f(w*.41)} ${f(h*.92)}Q${f(w*.12)} ${f(h*.92)} ${f(w*.12)} ${f(h*.68)}Z`)+P(`M${f(w*.7)} ${f(h*.34)}Q${f(w*.97)} ${f(h*.34)} ${f(w*.97)} ${f(h*.52)}Q${f(w*.97)} ${f(h*.7)} ${f(w*.7)} ${f(h*.64)}`),
sofa:(w,h)=>R(0,h*.12,w,h*.88,h*.2)+P(`M${f(w*.14)} ${f(h*.55)}H${f(w*.86)}`)+R(0,h*.32,w*.1,h*.68,3)+R(w*.9,h*.32,w*.1,h*.68,3),
ward:(w,h)=>R(0,0,w,h,3)+P(`M${f(w/2)} 0V${f(h)}`)+C(w*.42,h/2,1.6)+C(w*.58,h/2,1.6),
shelf:(w,h)=>R(0,0,w,h,2)+P(`M0 ${f(h/3)}H${f(w)}M0 ${f(h*2/3)}H${f(w)}`),
car:(w,h)=>R(0,0,w,h,w*.3)+R(w*.12,h*.2,w*.76,h*.18,3)+R(w*.12,h*.62,w*.76,h*.14,3),
bus:(w,h)=>R(0,0,w,h,4)+[.08,.3,.52,.74].map(a=>R(w*a,h*.18,w*.17,h*.3,2)).join(''),
taxi:(w,h)=>R(0,h*.22,w,h*.78,4)+R(w*.3,0,w*.4,h*.22,2)};
const I=[
{id:'bed',rm:'h',fn:'침대',nm:'월세·관리비',ar:.78,k:41,s:22.5,m:'주거비 중 월세가 클수록 침대, 곧 침실이 커진다.'},
{id:'heat',rm:'h',fn:'난방기',nm:'전기·가스',ar:1.3,k:6.2,s:4.5,m:'전기·가스 요금은 난방기의 크기로 나타낸다.'},
{id:'wifi',rm:'h',fn:'공유기',nm:'통신',ar:1.4,k:4,s:3,m:'통신비는 공유기의 크기로 나타낸다.'},
{id:'fridge',rm:'f',fn:'냉장고',nm:'식료품',ar:.6,k:19.6,s:14,m:'집에서 직접 해 먹을수록 식료품 지출이 늘고 냉장고가 커진다.'},
{id:'table',rm:'f',fn:'식탁',nm:'외식·학식',ar:1,k:27.6,s:23,m:'밖에서 사 먹는 비중이 클수록 식탁이 커진다.'},
{id:'cafe',rm:'f',fn:'커피 · 배달',nm:'카페·배달·기타',ar:1,k:3.3,s:8,m:'카페와 배달 지출은 컵의 크기로 나타낸다.'},
{id:'sofa',rm:'s',fn:'소파',nm:'여가·문화',ar:2.1,k:14,s:5,m:'여가·문화 지출이 클수록 소파가 커진다.'},
{id:'ward',rm:'s',fn:'옷장',nm:'의류·쇼핑',ar:1.5,k:12.8,s:6,m:'의류와 쇼핑 지출은 옷장의 크기로 나타낸다.'},
{id:'shelf',rm:'s',fn:'수납장',nm:'생활용품',ar:2,k:11,s:4,m:'생활용품 지출은 수납장의 크기로 나타낸다.'},
{id:'car',rm:'t',fn:'자동차',nm:'자동차·주유',ar:.5,k:18.4,s:0,m:'차가 있으면 현관 앞에 자동차가 놓인다. 유학생은 차가 없다.'},
{id:'bus',rm:'t',fn:'버스',nm:'대중교통',ar:2.2,k:11,s:7,m:'대중교통 지출은 버스의 크기로 나타낸다.'},
{id:'taxi',rm:'t',fn:'택시',nm:'택시·기타',ar:1,k:0,s:3,m:'택시와 기타 교통비는 작은 택시로 나타낸다.'}];
const DS={k:{n:'한국 1인 가구',t:168.9,r:{h:51.2,f:50.5,s:37.8,t:29.4}},s:{n:'중국인 유학생',t:100,r:{h:30,f:45,s:15,t:10}}};
DS.u={n:'내 지출',t:1,r:{h:0,f:0,s:0,t:0}};I.forEach(i=>i.u=i.s);
function rec(){const r={h:0,f:0,s:0,t:0};I.forEach(i=>r[i.rm]+=i.u);DS.u.r=r;DS.u.t=Math.max(1,r.h+r.f+r.s+r.t)}
const RN={h:['침실','주거비'],f:['주방','식비'],s:['거실','쇼핑/여가'],t:['현관','교통비']};
const A=240,FW=344,FH=484,OX=8,OY=8,LB=11;

/* 방 나누기 (squarified treemap) */
function sq(its,x,y,w,h){its=[...its].sort((a,b)=>b[1]-a[1]);const sc=w*h/its.reduce((a,b)=>a+b[1],0),ar=its.map(([k,v])=>[k,v*sc]),out=[];let row=[],i=0;
const sum=r=>r.reduce((a,b)=>a+b[1],0),worst=(r,s)=>{const t=sum(r);return Math.max(...r.map(b=>Math.max(s*s*b[1]/(t*t),t*t/(s*s*b[1]))))};
const place=r=>{const t=sum(r);if(w>=h){const cw=t/h;let yy=y;r.forEach(([k,a])=>{out.push([k,x,yy,cw,a/cw]);yy+=a/cw});x+=cw;w-=cw}else{const rh=t/w;let xx=x;r.forEach(([k,a])=>{out.push([k,xx,y,a/rh,rh]);xx+=a/rh});y+=rh;h-=rh}};
while(i<ar.length){const s=Math.min(w,h),c=[...row,ar[i]];if(!row.length||worst(c,s)<=worst(row,s)){row=c;i++}else{place(row);row=[]}}
if(row.length)place(row);return out}

/* 예비용: 줄 단위로 채워 넣기 */
function pack(its,W,H,g=7,k0=1){let k=k0;for(;k>.25;k*=.93){const rows=[];let row=[],rw=0;for(const it of its){const w=it.w*k,h=it.h*k;if(row.length&&rw+g+w>W){rows.push(row);row=[];rw=0}row.push({it,w,h});rw+=(row.length>1?g:0)+w}if(row.length)rows.push(row);
const hs=rows.map(r=>Math.max(...r.map(o=>o.h))+LB),th=hs.reduce((a,b)=>a+b+g,-g);
if(th<=H&&rows.every(r=>r.reduce((a,o)=>a+o.w,0)+g*(r.length-1)<=W+.5)){const out=[];let y=(H-th)/2;rows.forEach((r,j)=>{const rw=r.reduce((a,o)=>a+o.w,0)+g*(r.length-1);let x=(W-rw)/2;r.forEach(o=>{out.push({it:o.it,x,y:y+hs[j]-LB-o.h,w:o.w,h:o.h});x+=o.w+g});y+=hs[j]+g});return{k,pl:out}}}return{k:.25,pl:[]}}

/* 가구 배치: 방마다 '벽에 붙이는 자리'가 정해져 있다 [가로 0=왼쪽 1=오른쪽, 세로 0=위 1=아래] */
const SLOT={
 h:{bed:[.5,0],heat:[0,1],wifi:[1,1]},       // 침대는 머리를 위쪽 벽에, 난방기·공유기는 아래 모서리
 f:{fridge:[0,0],cafe:[1,0],table:[.5,1]},   // 냉장고·커피는 윗벽 조리대 쪽, 식탁은 방 가운데 아래
 s:{sofa:[.5,0],shelf:[0,1],ward:[1,1]},     // 소파는 윗벽에, 수납장·옷장은 아래 벽
 t:{car:[0,0],bus:[1,0],taxi:[1,1]}};        // 현관: 차는 왼쪽, 버스는 아래 오른쪽
function fitRoom(its,W,H,kmax,rm){
 if(!its.length)return{k:1,pl:[]};
 W=Math.max(12,W);H=Math.max(12,H);
 const slot=SLOT[rm],g=7;
 let k=Math.min(kmax,...its.map(i=>Math.min(W/i.w,H/(i.h+LB))));
 for(;k>.3;k*=.96){
  const pl=its.map(i=>{const w=i.w*k,h=i.h*k,[ax,ay]=slot[i.id]||[.5,.5];return{it:i,w,h,x:ax*(W-w),y:ay*(H-h-LB)}});
  let ok=true;
  for(let a=0;a<pl.length&&ok;a++)for(let b=a+1;b<pl.length;b++){const p=pl[a],q=pl[b];
   if(p.x<q.x+q.w+g&&q.x<p.x+p.w+g&&p.y<q.y+q.h+LB+g&&q.y<p.y+p.h+LB+g){ok=false;break}}
  if(ok)return{k,pl}}
 return pack(its,W,H,7,kmax)}

function geom(key){
 const D=DS[key],s=Math.min(1,Math.sqrt(D.t/168.9)),W=FW*s,H=FH*s,x0=OX+FW-W,y0=OY+FH-H;
 const rooms=sq(Object.entries(D.r).map(([a,b])=>[a,Math.max(b,.8)]),x0,y0,W,H).map(([k,x,y,w,h])=>{
  const its=I.filter(i=>i[key]>0&&i.rm===k).map(i=>{const a=i[key]*A;return{...i,v:i[key],w:Math.sqrt(a*i.ar),h:Math.sqrt(a/i.ar)}});
  return{k,x,y,w,h,its}});
 return{key,D,s,x0,y0,W,H,rooms}}

let sel='fridge',mode='b',open=false;

function plan(g,K){
 const {key,D,s,x0,y0,W,H,rooms}=g,ex=x0+W,ey=y0+H,sid=Math.round(Math.random()*1e6);
 let o=`<svg viewBox="0 0 360 500" role="img" aria-label="${D.n} 평면도"><defs>
<pattern id="gh${key}" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="var(--line)" stroke-width="1.2"/></pattern>
<pattern id="wd${key}" width="30" height="14" patternUnits="userSpaceOnUse"><path d="M0 13.6H30M15 0V14" fill="none" stroke="var(--pat)" stroke-width=".8"/></pattern>
<pattern id="tl${key}" width="14" height="14" patternUnits="userSpaceOnUse"><path d="M0 .5H14M.5 0V14" fill="none" stroke="rgba(255,255,255,.2)" stroke-width=".8"/></pattern></defs>
<rect class="ghost" x="${OX}" y="${OY}" width="${FW}" height="${FH}"/>`;
 if(s<.85)o+=`<text x="${OX+FW-10}" y="${OY+36}" text-anchor="end" font-size="30" font-weight="900" style="font-family:'Noto Serif KR',serif;fill:var(--ac)">−${Math.round((1-D.t/168.9)*100)}%</text><text x="${OX+FW-10}" y="${OY+54}" text-anchor="end" font-size="11" style="fill:var(--mut)">한국 1인 가구 대비 집 면적</text>`;
 for(const r of rooms){
  const {k,x,y,w,h}=r,pct=D.r[k]/D.t*100,big=w>160;
  o+=`<g class="rm rm-${k}"><rect class="bg" x="${f(x)}" y="${f(y)}" width="${f(w)}" height="${f(h)}"/><rect x="${f(x)}" y="${f(y)}" width="${f(w)}" height="${f(h)}" fill="url(#${k==='f'?'tl':'wd'}${key})" pointer-events="none"/>
<text x="${f(x+8)}" y="${f(y+17)}" font-size="12.5" font-weight="700">${RN[k][0]}</text>${w>=96?`<text x="${f(x+8)}" y="${f(y+30)}" font-size="9.5" style="opacity:.75">${RN[k][1]} ${D.r[k]}만원</text>`:''}<text x="${f(x+w-8)}" y="${f(y+(big?24:19))}" text-anchor="end" font-size="${big?22:16}" font-weight="700" style="font-family:'Noto Serif KR',serif">${pct.toFixed(1)}%</text>`;
  for(const p of r.fit.pl){const i=p.it;
   o+=`<g transform="translate(${f(x+6+p.x)} ${f(y+36+p.y)})"><g class="fur${i.id===sel?' sel':''}" data-id="${i.id}" tabindex="0" role="button" aria-label="${i.fn} ${i.v}만원"><title>${i.fn} · ${i.nm} ${i.v}만원</title><rect class="hit" x="-3" y="-3" width="${f(p.w+6)}" height="${f(p.h+6)}"/>${L[i.id](p.w,p.h)}</g><text x="${f(p.w/2)}" y="${f(p.h+10)}" text-anchor="middle" font-size="9.5" font-weight="700">${p.w>46?i.fn+' ':''}${i.v}</text></g>`}
  o+='</g>'}
 o+=`<rect class="wall" x="${f(x0)}" y="${f(y0)}" width="${f(W)}" height="${f(H)}"/>`;
 /* 창문: 위쪽·왼쪽 바깥벽 */
 const win=(x,y,v)=>{const l=34,t=3.2;return v?`<g><rect x="${f(x-t-.5)}" y="${f(y)}" width="${2*t+1}" height="${l}" fill="var(--bg)"/><path d="M${f(x-t)} ${f(y)}V${f(y+l)}M${f(x+t)} ${f(y)}V${f(y+l)}M${f(x)} ${f(y)}V${f(y+l)}" stroke="var(--ink)" stroke-width="1"/></g>`:`<g><rect x="${f(x)}" y="${f(y-t-.5)}" width="${l}" height="${2*t+1}" fill="var(--bg)"/><path d="M${f(x)} ${f(y-t)}H${f(x+l)}M${f(x)} ${f(y+t)}H${f(x+l)}M${f(x)} ${f(y)}H${f(x+l)}" stroke="var(--ink)" stroke-width="1"/></g>`};
 if(W>150){o+=win(x0+W*.24,y0,0)+win(x0+W*.66,y0,0)}
 if(H>200)o+=win(x0,y0+H*.4,1);
 /* 현관문: 현관 방의 바깥벽에 */
 const rt=rooms.find(r=>r.k==='t'),e=1.5;let door='';
 if(rt){const dw=Math.max(16,Math.min(26,Math.min(rt.w,rt.h)*.35));
  if(Math.abs(rt.y+rt.h-ey)<e){const hx=rt.x+rt.w/2-dw/2;door=`<rect x="${f(hx)}" y="${f(ey-3.4)}" width="${f(dw)}" height="6.8" fill="var(--rt)"/><path d="M${f(hx)} ${f(ey)}V${f(ey-dw)}A${f(dw)} ${f(dw)} 0 0 1 ${f(hx+dw)} ${f(ey)}" fill="none" stroke="var(--ink)" stroke-width="1.3" stroke-dasharray="3 2.5"/>`}
  else if(Math.abs(rt.x+rt.w-ex)<e){const hy=rt.y+rt.h/2-dw/2;door=`<rect x="${f(ex-3.4)}" y="${f(hy)}" width="6.8" height="${f(dw)}" fill="var(--rt)"/><path d="M${f(ex)} ${f(hy)}H${f(ex-dw)}A${f(dw)} ${f(dw)} 0 0 0 ${f(ex)} ${f(hy+dw)}" fill="none" stroke="var(--ink)" stroke-width="1.3" stroke-dasharray="3 2.5"/>`}}
 if(!door)door=`<path d="M${f(ex-46)} ${f(ey)}A32 32 0 0 1 ${f(ex-14)} ${f(ey-32)}" fill="none" stroke="var(--ink)" stroke-dasharray="3 3"/>`;
 return o+door+'</svg>'}

function icon(i){const w=i.ar>=60/48?56:46*i.ar,h=i.ar>=60/48?56/i.ar:46,wf=i.id==='wifi'?h:h;
 return `<div class="ic rm-${i.rm}"><svg viewBox="0 0 60 48"><g class="fur" transform="translate(${f((60-w)/2)} ${f((48-h)/2)})">${L[i.id](w,h)}</g></svg></div>`}

function draw(){
 rec();
 const ks=mode==='b'?['k','s']:[mode];
 $('ctl').hidden=mode!=='u';$('chips').hidden=mode==='u';
 document.querySelectorAll('.seg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.m===mode));
 const gs=ks.map(geom);
 const rh=r=>r.h-42-(r.k==='t'?30:0);
 gs.forEach(g=>g.rooms.forEach(r=>r.fit=fitRoom(r.its,r.w-12,rh(r),1,r.k)));
 const K=Math.max(.7,Math.min(1,...gs.flatMap(g=>g.rooms.map(r=>r.fit.k))));
 gs.forEach(g=>g.rooms.forEach(r=>r.fit=fitRoom(r.its,r.w-12,rh(r),K,r.k)));
 $('plans').innerHTML=gs.map(g=>`<div class="pw"><div class="hd"><h2>${g.D.n}</h2><span class="tot">월 ${f(g.D.t)}만원 · 식비 ${(g.D.r.f/g.D.t*100).toFixed(1)}%</span></div>${plan(g,K)}</div>`).join('');

 const i=I.find(x=>x.id===sel),r=i.k&&i.s?Math.round(i.s/i.k*100):null;
 const mx=Math.max(i.k,i.s,mode==='u'?i.u:0,1);
 const bar=(lb,v,c)=>`<div class="br"><span>${lb}</span><span class="tr"><i class="${c}" style="width:${v/mx*100}%"></i></span><b>${v||'—'}</b></div>`;
 $('det').innerHTML=`<div class="dh">${icon(i)}<div class="tx"><h3>${i.fn}</h3><p class="n">${RN[i.rm][0]} · ${i.nm}</p></div><div class="rt">${r===null?'—':r+'%'}<small>유학생 / 한국</small></div></div>
<div class="bars">${bar('한국 1인',i.k,'a')}${bar('유학생',i.s,'b')}${mode==='u'?bar('내 입력',i.u,'c'):''}</div>
<p class="mt"><em>비유</em>${i.m}</p>`;

 const pc=k=>ks.map(x=>(DS[x].r[k]/DS[x].t*100).toFixed(0)+'%').join(' / ');
 const val=i=>mode==='k'?(i.k||'—'):mode==='s'?(i.s||'—'):`${i.k||'—'} · ${i.s||'—'}`;
 $('chips').innerHTML=['h','f','s','t'].map(k=>`<div class="grp"><div class="gt">${RN[k][0]} · ${RN[k][1]}<span>${pc(k)}</span></div><div class="cg">${I.filter(i=>i.rm===k).map(i=>`<button class="chip" type="button" data-id="${i.id}" aria-pressed="${i.id===sel}">${i.fn.replace(' · ','·')}<b>${val(i)}</b></button>`).join('')}</div></div>`).join('');

 const sm=$('sum');if(sm)sm.textContent=`월 합계 ${f(DS.u.t)}만원 · 식비 ${(DS.u.r.f/DS.u.t*100).toFixed(1)}% · 한국 1인 가구(168.9만원) 크기까지 표시됩니다.`;
 const tg=$('tg');tg.textContent=open?'닫기 ▾':(mode==='u'?'지출 입력하기 ▴':'전체 가구 목록 ▴');
 $('panel').classList.toggle('open',open);
 fit()}

/* 화면 크기에 맞춰 평면도를 '한 화면'에 */
function fit(){
 const st=$('stage'),pl=$('plans'),n=pl.children.length;if(!n)return;
 const cs=getComputedStyle(st),aw=st.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight);
 const kh=getComputedStyle($('key')).display==='none'?0:$('key').offsetHeight;
 const ah=st.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom)-kh-4;
 const scroll=innerWidth<700&&n>1,gap=20;
 const wH=(ah-42)*360/500;
 let w=scroll?Math.min(aw*.9,wH):Math.min((aw-gap*(n-1))/n,wH);w=Math.max(120,w);
 [...pl.children].forEach(pw=>{pw.style.width=w+'px';const s=pw.querySelector('svg');s.style.width=w+'px';s.style.height=(w*500/360)+'px'});
 pl.style.justifyContent=scroll?'flex-start':'center'}
new ResizeObserver(fit).observe($('stage'));

function buildCtl(){
 let o='<p class="sum" id="sum"></p><div class="pre"><button type="button" data-p="k">한국 평균으로</button><button type="button" data-p="s">유학생 평균으로</button></div><p class="sum" style="margin:6px 0 0">슬라이더 단위: 만원/월</p>';
 for(const k of['h','f','s','t']){o+=`<div class="ctl-g">${RN[k][0]} · ${RN[k][1]}</div>`;
  I.filter(i=>i.rm===k).forEach(i=>{o+=`<label class="ctl-r"><span>${i.fn}<small>${i.nm}</small></span><input type="range" min="0" max="50" step="0.5" value="${i.u}" data-u="${i.id}" aria-label="${i.fn} ${i.nm} 만원"><output>${i.u}</output></label>`})}
 $('ctl').innerHTML=o}

document.addEventListener('click',e=>{
 const pb=e.target.closest('[data-p]');
 if(pb){I.forEach(i=>i.u=i[pb.dataset.p]);document.querySelectorAll('[data-u]').forEach(r=>{const v=I.find(i=>i.id===r.dataset.u).u;r.value=v;r.nextElementSibling.textContent=v});draw();return}
 if(e.target.closest('#tg')){open=!open;draw();return}
 const m=e.target.closest('[data-m]');
 if(m){mode=m.dataset.m;open=mode==='u'&&innerWidth<900;draw();return}
 const t=e.target.closest('[data-id]');
 if(t){sel=t.dataset.id;draw()}});
document.addEventListener('keydown',e=>{
 if(e.key==='Enter'||e.key===' '){const t=e.target.closest&&e.target.closest('[data-id]');
  if(t){e.preventDefault();const box=t.closest('#plans')?'#plans':'#chips';sel=t.dataset.id;draw();const nx=document.querySelector(`${box} [data-id="${sel}"]`);if(nx)nx.focus()}}});
document.addEventListener('input',e=>{const r=e.target.closest('[data-u]');if(r){I.find(i=>i.id===r.dataset.u).u=+r.value;r.nextElementSibling.textContent=r.value;sel=r.dataset.u;draw()}});
document.addEventListener('focusin',e=>{const r=e.target.closest&&e.target.closest('[data-u]');if(r&&sel!==r.dataset.u){sel=r.dataset.u;draw()}});
buildCtl();draw();
</script></body></html>
