<script>
const f=n=>+n.toFixed(1);

const L={
bed:(w,h)=>K('g',R(-6,h*.4,w+12,h*.66,6))+R(0,0,w,h,4)+K('w',R(0,0,w,h*.07,3))+[.1,.52].map(a=>R(w*a,h*.09,w*.38,h*.17,w*.07)+K('t',P(`M${f(w*(a+.06))} ${f(h*.175)}H${f(w*(a+.32))}`))).join('')+K('a',R(w*.03,h*.3,w*.94,h*.67,5))+K('l',R(w*.03,h*.3,w*.94,h*.11,3))+K('t',P(`M${f(w*.1)} ${f(h*.58)}H${f(w*.9)}M${f(w*.1)} ${f(h*.68)}H${f(w*.9)}`))+K('l',R(w*.03,h*.8,w*.94,h*.13,3)),

table:(w,h)=>{const r=Math.min(w,h),c=r/2,z=r*.22,d=r*.36;return chair(c,c-d,0,z)+chair(c+d,c,90,z)+chair(c,c+d,180,z)+chair(c-d,c,270,z)+C(c,c,r*.27)+K('t',C(c,c,r*.21))+K('a',C(c,c,r*.07))},

bus:(w,h)=>K('d',[.12,.66].map(a=>R(w*a,-h*.05,w*.15,h*.07,1)+R(w*a,h*.98,w*.15,h*.07,1)).join(''))+R(0,0,w,h,h*.2)+K('t',R(w*.04,h*.12,w*.78,h*.76,3))+[0,1,2].map(i=>K('t',R(w*.1+i*w*.25,h*.28,w*.19,h*.44,2)+P(`M${f(w*.1+i*w*.25+w*.095)} ${f(h*.28)}V${f(h*.72)}`))).join('')+K('a',P(`M${f(w*.84)} ${f(h*.1)}L${f(w*.97)} ${f(h*.22)}V${f(h*.78)}L${f(w*.84)} ${f(h*.9)}Z`)),

const I=[
{id:'bed',rm:'h',fn:'침대',nm:'월세·관리비',ar:.78,a:[.5,0],k:41,s:22.5,m:'월세·관리비가 클수록 침대가 커지고 침실이 넓어진다.'},
{id:'heat',rm:'h',fn:'난방기',nm:'전기·가스',ar:1.3,a:[1,1],k:6.2,s:4.5,m:'전기·가스 요금이 클수록 난방기가 커진다.'},
{id:'wifi',rm:'h',fn:'공유기',nm:'통신비',ar:1.4,a:[0,1],k:4,s:3,m:'통신비가 클수록 공유기가 커진다.'},

o+=`<div class="stack" id="stack">${['h','f','s','t'].map(k=>`<i data-k="${k}" style="--c:var(--r${k})" title="${RN[k][0]}"></i>`).join('')}</div><div class="pre"><button data-p="k">한국 평균</button><button data-p="s">유학생 평균</button><p class="sum" id="sum"></p></div>`;$('ctl').innerHTML=o}
document.addEventListener('click',e=>{const q=e.target.closest.bind(e.target),p=q('[data-p]');if(p){I.forEach(i=>i.u=i[p.dataset.p]);draw();return}
const m=q('.seg [data-m]');if(m){mode=m.dataset.m;draw();return}
const w=q('[data-e]');if(w){go(+w.dataset.e);return}
const t=q('[data-t]');if(t){tab=t.dataset.t;draw();return}
const d=q('[data-id]');if(d){sel=d.dataset.id;tab=I.find(i=>i.id===sel).rm;draw();return}
const r=q('[data-rm]');if(r&&mode==='u'){tab=r.dataset.rm;draw()}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){const t=e.target.closest&&e.target.closest('[data-id]');if(t){e.preventDefault();sel=t.dataset.id;tab=I.find(i=>i.id===sel).rm;draw()}}});
document.addEventListener('input',e=>{if(e.target.id==='tr'){T=+e.target.value;draw();return}const r=e.target.closest('[data-u]');if(r){I.find(i=>i.id===r.dataset.u).u=+r.value;draw()}});
build();draw();
</script></body></html>
